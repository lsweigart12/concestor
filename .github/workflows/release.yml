# Cut a release. Batched: merges accumulate, the train ships daily, the button
# ships now.
#
# The version is decided by the commits since the last tag, per Conventional
# Commits; `release.config.cjs`'s `releaseRules` is where the type-to-bump
# mapping is written down, and is deliberately the only place it is.
# `commitlint.config.cjs` is what keeps the commits well-formed, and CI rejects
# a pull request whose commits are not. So the release is a consequence of the
# commit log rather than a decision taken afterwards, which is the only way
# "100% automated" is honest rather than "automated, given someone remembered".
# **The cron is what keeps that true**: a train nobody has to remember to
# catch is still automation, where a button alone would be a habit.
#
# It used to run on CI succeeding on main — one release, and one production
# deploy, per releasable merge. That is exactly wrong for the way this project
# is worked: several worktrees produce several pull requests in a sitting, and
# five merges became five versions and five deploys, four of them pointless,
# each with notes describing one pull request. Batching is semantic-release's
# native mode — highest bump wins, the notes cover every commit since the last
# tag — so the change is entirely in the trigger.
#
# What `workflow_run` bought was the guarantee that the released commit's tests
# were green. The gate below buys it back by asking the API, which is a
# question that can be asked of any commit at any time rather than only of the
# one an event just named.
#
# What comes out: a git tag, a GitHub Release whose notes are generated from
# the commits, four assets — two server binaries, the built frontend, and
# checksums — and, when a release was actually published, a production deploy.
# Nothing is committed back to this repository. See `release.config.cjs` for
# why the tag is the only place the version is written.
#
# **The deploy is a job here rather than a trigger over there**, and that is
# load-bearing. `deploy-web.yml` used to carry `on: release: [published]`,
# which never fired once in ten releases: semantic-release publishes with
# `secrets.GITHUB_TOKEN` and GitHub does not start workflows from events that
# token raises. Calling the deploy directly needs no new credential, and it
# also puts the failure where it belongs — a deploy that breaks turns *this*
# run red, next to the release it failed to ship. docs/ci.md §4.

name: Release

on:
  # The train. A day with nothing releasable is a clean no-op: semantic-release
  # answers "no release", the `released` output stays unset, and the deploy
  # below does not run. The cadence is a starting point rather than a
  # conviction — if daily is wrong, this is the one line to change.
  schedule:
    - cron: "0 16 * * *" # daily, 16:00 UTC ≈ morning US Pacific

  # The button, for a fix that should not wait for tomorrow. `dry_run` defaults
  # to true on purpose: a careless click should print, not ship. Releasing is
  # unchecking the box.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Work out the next version and print the notes, release nothing"
        type: boolean
        default: true

permissions:
  contents: write
  # The tip-green gate asks the Actions API which CI run belongs to the commit
  # it is about to release. Reading another workflow's runs is its own scope,
  # and without it the gate 404s and every train fails.
  actions: read

concurrency:
  # No cancel-in-progress. A cancelled release can leave a tag pushed and no
  # GitHub Release attached to it, which is a state nobody chose and which the
  # next run then has to be talked out of.
  group: release

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    # Both written by `release.config.cjs`'s `successCmd`, which runs only when
    # a release was published. Absent on a dry run, on a skipped gate, and on
    # the many merges whose commits release nothing.
    outputs:
      released: ${{ steps.semantic.outputs.released }}
      tag: ${{ steps.semantic.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # semantic-release reads the whole history to find the last tag and
          # every commit since it. A shallow clone silently produces a wrong
          # version rather than an error.
          fetch-depth: 0
          persist-credentials: false

      # **A release must not be cut from a commit whose tests were never
      # green.** No event carries that fact any more, so it is asked for: the
      # CI run for *this exact sha*, on the push that put it on main.
      #
      # The two paths answer a non-green tip differently, and the difference is
      # the whole reason this is one step rather than a job-level `if:`.
      #
      #   - **Cron skips with a notice.** Nobody asked for this run; the next
      #     train ships whatever `main` has been fixed into by then, and a red
      #     train every morning until someone notices is noise that teaches
      #     people to stop reading red.
      #   - **Dispatch fails.** A human asked for a release and is standing
      #     there. Being told no is the answer; being silently obliged tomorrow
      #     is not.
      #
      # A tip with *no* CI run at all fails the same way, deliberately. CI runs
      # on every push to `main`, so its absence means something is broken
      # upstream of everything below — and "no evidence" must never read as
      # "green". A run still in flight is the same answer for the same reason:
      # `conclusion` is null until it finishes.
      - name: Is main's tip green?
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_CRON: ${{ github.event_name == 'schedule' }}
        run: |
          sha=$(git rev-parse HEAD)
          # `event=push` because CI also runs on pull requests, and a pull
          # request's run is against its own head — a different commit that
          # could not be this one, but the filter says so rather than relying
          # on it. Newest first is the API's default order, so a re-run of CI
          # is the answer rather than the original attempt.
          #
          # `status` and `conclusion` are both read because they fail
          # differently and the notice has to say which: an absent run, an
          # unfinished one and a red one are three different mornings.
          answer=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&event=push&per_page=1" \
            -q '"\(.workflow_runs[0].status // "absent") \(.workflow_runs[0].conclusion // "pending")"' \
            2>/dev/null) || answer="absent pending"
          status=${answer% *}
          conclusion=${answer#* }

          if [ "$conclusion" = "success" ]; then
            echo "main's tip ${sha} has a green CI run."
            exit 0
          fi

          case "$status" in
          absent) why="has no CI run on the push that landed it" ;;
          completed) why="has a CI run that concluded ${conclusion}" ;;
          *) why="has a CI run that is still ${status}" ;;
          esac

          if [ "$IS_CRON" = "true" ]; then
            echo "::notice::main's tip ${sha} ${why}. Skipping — tomorrow's train ships it once main is green."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::main's tip ${sha} ${why}, so there is nothing safe to release. Fix main and press Release again."
            exit 1
          fi

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Needed by scripts/ci/build-release.sh, which cross-compiles the server
      # for both Linux architectures before the release is published.
      - uses: actions/setup-go@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: semantic-release
        id: semantic
        if: steps.gate.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Pinned to majors rather than floating: a release pipeline that
        # changes behaviour because an upstream published on a Tuesday is not
        # a pipeline. commit-analyzer, release-notes-generator and github ship
        # inside semantic-release; exec does not.
        run: |
          git tag --list 'v*' | sort > "$RUNNER_TEMP/tags-before"

          npx --yes \
            -p semantic-release@24 \
            -p @semantic-release/exec@6 \
            semantic-release ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

          # The deploy job below runs on `released`, and nothing else reads it,
          # so if `successCmd` ever stops firing the deploy stops happening and
          # this run stays green — which is precisely the failure this change
          # exists to remove, rebuilt one level up. The tag semantic-release
          # creates locally before pushing is an independent witness of the
          # same event, so the two disagreeing is a failure rather than a
          # quiet no-deploy. A dry run makes no tag and sets no output, and is
          # consistent for the same reason.
          git tag --list 'v*' | sort > "$RUNNER_TEMP/tags-after"
          cut=$(comm -13 "$RUNNER_TEMP/tags-before" "$RUNNER_TEMP/tags-after")
          if [ -n "$cut" ] && ! grep -qx 'released=true' "$GITHUB_OUTPUT"; then
            echo "::error::semantic-release tagged ${cut} but reported no published release, so the deploy will not run and production will keep serving the previous version. release.config.cjs's successCmd is what sets this."
            exit 1
          fi

  # Production. Only when something was published — a `ci:` or `docs:` merge
  # reaches semantic-release, is correctly told there is no version in it, and
  # must not deploy, because a deploy per merge is what the release pipeline
  # exists instead of.
  #
  # The tag is passed rather than left to be worked out, so the deploy checks
  # out the commit the release notes describe. That matters more here than it
  # looks: `web/wrangler.jsonc` pins the container image by tag, so the commit
  # deployed decides the *dataset* served, and `wrangler rollback` cannot undo
  # a wrong pairing — docs/deployment.md §5.
  #
  # `secrets: inherit` passes the Cloudflare credentials through. With none
  # set, deploy-web.yml's own guard step still skips every step and reports
  # green, so this adds no way for the deploy to fail on a repository that has
  # no account.
  # **The permissions here must cover everything deploy-web.yml declares**, and
  # not covering them is a startup failure of this *whole run* rather than of
  # this job. A called workflow may not request more than its caller grants;
  # this file's `contents: write` was the whole grant, deploy-web.yml added
  # `pull-requests: write` so it could comment a preview URL, and the Release
  # run that followed the merge never started — no jobs, no logs, no
  # annotation, and `startup_failure` as the only word about it.
  #
  # Two things make that worth a comment this long. It happens even though this
  # job is **skipped** on the run that caused it, because GitHub validates
  # every called workflow before it runs any job — so a permission a preview
  # needs took down the release path, which is the one thing in this repository
  # that must not go quiet (§4 of docs/ci.md is the last time it did). And the
  # failure is *upstream* of the `if:` above, so nothing about `released`
  # protects it. Whenever deploy-web.yml's `permissions:` block grows, this
  # block grows with it.
  deploy:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/deploy-web.yml
    permissions:
      # Read, not write: the deploy checks a tag out and builds it. The
      # workflow-level `contents: write` above is semantic-release's, and a
      # job that does not push anything should not carry it.
      contents: read
      pull-requests: write
    with:
      release_tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
