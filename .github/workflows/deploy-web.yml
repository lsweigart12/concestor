# Deploy Concestor to Cloudflare: the Worker, its static assets, and the
# Container binding that runs the Go read API.
#
# **It assembles the API image, and it does not build the dataset.** Those are
# two different claims and the split is the point. The *dataset* — 2.2 GB of
# pipeline output that is not in this repository — is pushed as a base image by
# `scripts/deploy/push-data-image.sh` from a checkout that has build/, and
# must never be produced here. The *binary* is 10 MB compiled from the tag this
# run is deploying, and adding it to that base is seconds of work against the
# registry. Doing it here is what stops production running a server nobody
# shipped. docs/deployment.md is the decision and §5 is the deploy mechanics;
# docs/ci.md §3 is the short version.
#
# Nothing is configured yet, and this workflow is written so that costs
# nothing: with no credentials in the repository every deploy step is skipped
# and the run is green with a notice saying why. It is not a failure to have
# no Cloudflare account; it is a failure to discover on the day you get one
# that the pipeline was never wired up.
#
# To turn it on, set in the repository:
#   secret CLOUDFLARE_API_TOKEN    — "Edit Cloudflare Workers", and container
#                                    registry write, which the assembly step
#                                    below now genuinely needs
#   secret CLOUDFLARE_ACCOUNT_ID
#   variable CONCESTOR_API_ORIGIN  — optional. Set it only to route /v1 to an
#                                    API *outside* Cloudflare; leaving it
#                                    unset is what uses the container.

name: Deploy web

# Production deploys on a *release*, not on every push to main. That is the
# whole point of having a release pipeline: what is in production has a version
# number, appears in the release notes, and can be named in a rollback. A
# deploy per merge has none of those and cannot be talked about afterwards.
#
# **`release.yml` calls this workflow.** There is deliberately no
# `release: [published]` trigger, and its absence is the fix rather than an
# oversight. semantic-release publishes with `secrets.GITHUB_TOKEN`, and GitHub
# does not start workflows from events raised by that token — the recursion
# guard. So a `release: published` trigger sat here looking like the production
# path and fired **zero times in ten releases**, every one of which was then
# deployed by hand. It was silent because the release job was green: the tag,
# the notes and the assets all existed, and only the running site was old.
# docs/ci.md §4 is the account.
#
# Pull requests still get a preview version, because a preview is for looking
# at a change before it is a release.
#
# **A preview is a version of a different Worker**, `web/wrangler.preview.jsonc`,
# and that is forced rather than tidy: Cloudflare does not generate preview URLs
# for a Worker that implements a Durable Object, and production's container class
# is one. This workflow uploaded `--preview-alias pr-N` against the production
# Worker for its whole life and every one of those aliases pointed at nothing —
# no URL printed, `has_preview: false` on the version, error 1042 at the
# hostname. The preview Worker has no container and reaches the real dataset by
# proxying `/v1` to production. docs/deployment.md §5 is the account.
on:
  # Called by release.yml, once semantic-release has actually published. The
  # tag is an input rather than something read off the event, because under
  # `workflow_call` `github.event` is the *caller's* and carries no release.
  workflow_call:
    inputs:
      release_tag:
        description: The tag to deploy — checked out, and built into the bundle
        required: true
        type: string
      preview_alias:
        # Declared here only so that the job-level expressions below can read
        # `inputs.preview_alias` under every trigger. release.yml does not pass
        # it, which is what makes a called run a production deploy.
        description: Unused on the release path — see the dispatch input
        required: false
        type: string
        default: ""
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        # The hand-deploy path needs this for the same reason the release path
        # does: main's tip is not necessarily the commit a tag names, and
        # `web/wrangler.jsonc` pins the container image, so deploying the wrong
        # commit ships the wrong dataset with it.
        description: Tag to deploy. Empty deploys the tip of the chosen branch
        required: false
        type: string
        default: ""
      preview_alias:
        # The answer to "I want to look at this branch without opening a pull
        # request". Setting it makes the run a **preview** and nothing is
        # deployed: the alias becomes
        # `<alias>-concestor-preview.<subdomain>.workers.dev` and stays there
        # across every later run that names it again.
        #
        # It is a separate input rather than a checkbox because the alias is a
        # hostname somebody has to be able to say out loud, and because a
        # dispatch that silently chose one would be a dispatch nobody could
        # find the result of.
        description: Preview under this alias instead of deploying. Lowercase letters, digits and dashes
        required: false
        type: string
        default: ""

permissions:
  contents: read
  # The preview URL is commented onto the pull request, which is the only place
  # anybody is looking when they want it. A fork's pull request has no token
  # with this and no credentials either, so it skips the whole job.
  pull-requests: write

concurrency:
  # Not cancel-in-progress. Cancelling a deploy halfway leaves the account in
  # a state nobody chose; queueing costs a few minutes and never does.
  group: deploy-web-${{ github.ref }}

jobs:
  # `github.event_name` is the *caller's* event under `workflow_call`, so it
  # reads `workflow_run` on the release path rather than anything named after
  # a release. Every test below asks only whether this run is a *preview*, which
  # stays exactly right: a preview is the one thing `workflow_call` is never
  # used for. Do not rewrite these into a test for what a production deploy
  # *is* without checking what the caller's event actually says.
  #
  # Two things make a preview: a pull request, or a dispatch that named an
  # alias. The condition is written out in three places below rather than
  # computed once, because `name` and `environment` are evaluated before any
  # step runs and so cannot read a step's output.
  deploy:
    name: ${{ (github.event_name == 'pull_request' || inputs.preview_alias != '') && 'preview' || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'pull_request' || inputs.preview_alias != '') && 'preview' || 'production' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_ORIGIN: ${{ vars.CONCESTOR_API_ORIGIN }}
      # A deploy job should not phone home about its own tooling.
      WRANGLER_SEND_METRICS: "false"
    steps:
      # Secrets are unreadable in a job-level `if`, and a fork's pull request
      # has none at all, so the guard is a step whose output every later step
      # keys off. This is also what makes fork PRs safe: they get a skipped
      # deploy rather than a failed one.
      - name: Is Cloudflare configured?
        id: guard
        env:
          PREVIEW_ALIAS: ${{ inputs.preview_alias }}
          PR_NUMBER: ${{ github.event.number }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cloudflare credentials in this repository — skipping the deploy. See .github/workflows/deploy-web.yml for what to set."
          fi
          if [ -n "$API_ORIGIN" ]; then
            echo "::notice::CONCESTOR_API_ORIGIN is set — /v1 will be proxied to it and the Container will not be used."
          fi

          # Which of the two things this run is, decided once. A pull request
          # previews under `pr-<N>`; a dispatch previews under the alias it was
          # given; anything else deploys production.
          if [ "$IS_PR" = "true" ]; then
            alias="pr-${PR_NUMBER}"
          else
            alias="$PREVIEW_ALIAS"
          fi

          if [ -n "$alias" ]; then
            # Cloudflare's rules, enforced here because the failure otherwise
            # arrives from wrangler with the run half over: lowercase letters,
            # digits and dashes, leading letter, and the alias plus
            # `-concestor-preview` must fit a 63-character DNS label. A branch
            # name pasted in raw — `claude/issue-84-web-lint-format` — is the
            # ordinary case, so it is folded rather than rejected.
            alias=$(printf '%s' "$alias" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9-]/-/g' -e 's/^[^a-z]*//' -e 's/-*$//' | cut -c1-45 | sed -e 's/-*$//')
            if [ -z "$alias" ]; then
              echo "::error::preview_alias has no lowercase letter to start from, so there is no hostname it could become."
              exit 1
            fi
            echo "mode=preview" >> "$GITHUB_OUTPUT"
            echo "alias=$alias" >> "$GITHUB_OUTPUT"
          else
            echo "mode=production" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.guard.outputs.configured == 'true'
        with:
          # On a release, the tag — not main's tip. Between the tag being cut
          # and this job starting, main can have moved, and deploying that
          # would put code in production that the release notes do not
          # describe. Empty on a pull request, which checks out the
          # triggering ref.
          ref: ${{ inputs.release_tag }}
          # The whole history, because a hand tip-deploy names the image it is
          # about to assemble with `git describe`, and a shallow clone has no
          # tags to describe against. It is a source-only repository — the
          # dataset is deliberately not in it — so this costs seconds.
          fetch-depth: 0

      # For the cross-compile in `Assemble the API image`. Not needed on the
      # preview path, which ships no binary at all.
      - uses: actions/setup-go@v7
        if: steps.guard.outputs.configured == 'true' && steps.guard.outputs.mode == 'production'
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        if: steps.guard.outputs.configured == 'true'
        working-directory: web
        env:
          # The same version the release compiled into the server binary, so
          # a frontend and an API can be compared without guessing. Falls back
          # to the sha on a preview, which has no version by definition.
          VITE_APP_VERSION: ${{ inputs.release_tag || github.sha }}
        # Rebuilt here rather than pulled from CI's artifact: a deploy that
        # depends on another workflow's output can ship a bundle whose source
        # nobody can name. `tsc -b` runs as part of `build`, and so does the
        # worker's own typecheck, so a type error on the deploy path still
        # stops it.
        run: |
          npm ci
          npm run build

      # `web/wrangler.jsonc` commits an image reference with two shouting
      # placeholders, and they are substituted for opposite reasons.
      #
      #   registry.cloudflare.com/ACCOUNT_ID/concestor-api:<build_id>-RELEASE
      #
      # **ACCOUNT_ID** because wrangler does not interpolate environment
      # variables into its config — a literal ${CLOUDFLARE_ACCOUNT_ID} is
      # pushed straight through to the registry path — and because a committed
      # account id is what lets ci.yml's dry run validate this file on a
      # repository with no account at all.
      #
      # **RELEASE** because the code half of the tag is derived from the thing
      # being deployed rather than maintained by hand. It used to be a commit
      # somebody pasted in after building an image locally, and it drifted: the
      # server changed, a release shipped, and the pin still named the old
      # binary. Deriving it here means it cannot.
      #
      # **`<build_id>` is committed and stays committed.** That half is the
      # dataset, it moves on the pipeline's cadence, and pinning it is what
      # makes rolling the Worker back roll the dataset back with it.
      #
      # The greps run on the preview path too, where the substitution itself is
      # inert — `wrangler.preview.jsonc` has no container and never reads this
      # file. That is deliberate: a pin that names no image is worth failing a
      # pull request over, and this is the only place it is checked at all.
      - name: Resolve the container image reference
        id: image
        if: steps.guard.outputs.configured == 'true'
        working-directory: web
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          MODE: ${{ steps.guard.outputs.mode }}
        run: |
          if ! grep -q 'registry.cloudflare.com/ACCOUNT_ID/' wrangler.jsonc; then
            echo "::error::wrangler.jsonc has no ACCOUNT_ID placeholder to substitute. Did the image reference change shape?"
            exit 1
          fi
          if grep -q 'concestor-api:unpublished' wrangler.jsonc; then
            echo "::error::The container image pin is still 'unpublished'. Run scripts/deploy/push-data-image.sh from a checkout with build/, then commit the pin it prints. docs/deployment.md §5."
            exit 1
          fi

          # The pin, read back rather than assumed, which is also how the
          # build id is extracted. A pin that has lost its -RELEASE suffix is a
          # hand-edit that would deploy a tag nothing mints.
          pin=$(grep -o 'concestor-api:[A-Za-z0-9_.-]*' wrangler.jsonc | head -1)
          case "$pin" in
          concestor-api:*-RELEASE) build_id=${pin#concestor-api:}; build_id=${build_id%-RELEASE} ;;
          *)
            echo "::error::The container image pin is '${pin}', which does not end in -RELEASE. The committed tag names the dataset; the release half is substituted here. docs/deployment.md §5."
            exit 1
            ;;
          esac

          if [ "$MODE" != "production" ]; then
            echo "::notice::Preview — the pin is validated but not substituted; wrangler.preview.jsonc has no container."
            exit 0
          fi

          # On the release path the tag is handed in and is authoritative. On a
          # hand tip-deploy it is worked out, and `--always` matters: at the tag
          # itself `describe` says `v0.6.0` and the release's own image is
          # reused, while three commits past it says `v0.6.0-3-gabc1234` — a
          # name that is unique and true, where a bare `v0.6.0` would put a tip
          # binary in an image claiming to be that release.
          release="$RELEASE_TAG"
          if [ -z "$release" ]; then
            release=$(git describe --tags --always --dirty)
            echo "::notice::No release_tag given — deploying the tip and naming its image ${release}."
          fi

          api="registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/concestor-api:${build_id}-${release}"
          data="registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/concestor-data:${build_id}"

          sed -i "s|registry.cloudflare.com/ACCOUNT_ID/${pin}|${api}|" wrangler.jsonc

          # Read back, because a sed that matched nothing exits 0. The patterns
          # are the *reference* forms rather than the bare words: this file's
          # comments talk about both placeholders at length, and a guard that
          # tripped on prose would have to be deleted the first time somebody
          # explained the mechanism.
          if grep -qE 'registry\.cloudflare\.com/ACCOUNT_ID/|concestor-api:[A-Za-z0-9_.]+-RELEASE' wrangler.jsonc; then
            echo "::error::A placeholder survived substitution in wrangler.jsonc. Deploying it would name an image that cannot exist."
            grep -nE 'registry\.cloudflare\.com/ACCOUNT_ID/|concestor-api:[A-Za-z0-9_.]+-RELEASE' wrangler.jsonc
            exit 1
          fi

          {
            echo "api=$api"
            echo "data=$data"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "dataset  $build_id"
          echo "release  $release"

      # **The image the deploy is about to name, made to exist.** Idempotent by
      # design, and inside the deploy rather than beside it, which buys four
      # things at once: a deploy can never point at an image that is not there;
      # a failed assembly is a red deploy next to the release it failed;
      # re-running **Deploy web** heals any gap; and rolling back to an old tag
      # reconstructs that tag's exact image — its wrangler.jsonc names its data
      # base, its source builds its binary — even if the registry has been
      # cleaned since.
      #
      # It is `crane mutate` against the remote base, not a Docker build. The
      # registry already holds the 2.2 GB, so appending a 10 MB layer and
      # setting four config directives is a manifest write: **measured at 7
      # seconds**, against the several minutes pulling the base would cost.
      # `server/Dockerfile.api` is the same operation expressed for Docker and
      # is the fallback for a local or emergency rebuild; the two must stay
      # equivalent, and that file says so.
      - name: Assemble the API image
        if: steps.guard.outputs.configured == 'true' && steps.guard.outputs.mode == 'production'
        env:
          API_IMAGE: ${{ steps.image.outputs.api }}
          DATA_IMAGE: ${{ steps.image.outputs.data }}
          RELEASE: ${{ steps.image.outputs.release }}
          # Pinned with its published checksum rather than floating on
          # `latest`: this step has registry write, and a release pipeline that
          # changes behaviour because an upstream published on a Tuesday is not
          # a pipeline.
          CRANE_VERSION: v0.21.9
          CRANE_SHA256: 5c16d8ddb971cb1d5e6ed8b1e743da8224414eeba2c2762d8f1a61b2f095699e
        run: |
          set -euo pipefail

          curl -sSL -o "$RUNNER_TEMP/crane.tgz" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  ${RUNNER_TEMP}/crane.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/crane.tgz" -C "$RUNNER_TEMP" crane
          CRANE="$RUNNER_TEMP/crane"

          # A short-lived registry token from the same credential wrangler
          # pushes with, so nothing new has to be stored. `--push --pull`
          # because this both reads the base's manifest and writes the result.
          creds=$(npx --prefix web wrangler containers registries credentials \
            registry.cloudflare.com --push --pull --json)
          printf '%s' "$creds" |
            python3 -c 'import json,sys; d=sys.stdin.read(); print(json.loads(d[d.index("{"):])["password"])' |
            "$CRANE" auth login registry.cloudflare.com -u v1 --password-stdin

          # **Step one is a question, not a build.** A re-run, a rollback and a
          # second deploy of the same tag all land here and stop.
          if "$CRANE" manifest "$API_IMAGE" >/dev/null 2>&1; then
            echo "::notice::${API_IMAGE} already exists — nothing to assemble."
            exit 0
          fi

          # **The existence gate.** A missing data base is the one failure this
          # design cannot fix by itself: it means a dataset was pinned but never
          # pushed, or pushed but never pinned. Saying which tag was wanted is
          # the whole value of failing here rather than shipping a container
          # that boots without a dataset.
          if ! "$CRANE" manifest "$DATA_IMAGE" >/dev/null 2>&1; then
            echo "::error::No data base image at ${DATA_IMAGE}. web/wrangler.jsonc pins a dataset build id that is not in the registry — run scripts/deploy/push-data-image.sh from a checkout with build/, or correct the pin. docs/deployment.md §5."
            exit 1
          fi

          # The same static cross-compile scripts/ci/build-release.sh does, and
          # for the same reason it injects the version: without -X main.version
          # the binary keeps main.go's honest "dev" default and /v1/about
          # reports `release: "dev"` — the one field naming which code is live,
          # naming nothing.
          echo "compiling the server for linux/amd64 at ${RELEASE}…"
          mkdir -p "$RUNNER_TEMP/layer/usr/local/bin"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -C server \
            -trimpath \
            -ldflags "-s -w -X main.version=${RELEASE} -X main.commit=$(git rev-parse --short HEAD)" \
            -o "$RUNNER_TEMP/layer/usr/local/bin/concestor-server" .

          # 65532 is distroless's `nonroot`, matching the `COPY --chown` the
          # Dockerfile used to do. The rest is determinism: the same source at
          # the same version produces the same layer, so re-assembling a tag
          # that was deleted from the registry restores it rather than
          # replacing it with something new that happens to work.
          tar --sort=name --owner=65532 --group=65532 --numeric-owner --mtime=@0 \
            -C "$RUNNER_TEMP/layer" -cf "$RUNNER_TEMP/layer.tar" usr

          # The four directives `Dockerfile.api` carries, in one write. 8080 is
          # worker/index.ts's `defaultPort`; the image and the Worker have to
          # agree on one and this is the pair.
          "$CRANE" mutate "$DATA_IMAGE" \
            --append "$RUNNER_TEMP/layer.tar" \
            --user nonroot \
            --exposed-ports 8080/tcp \
            --entrypoint /usr/local/bin/concestor-server \
            --cmd='-addr,:8080,-build,/srv/build' \
            --tag "$API_IMAGE"

          echo "::notice::Assembled ${API_IMAGE} from ${DATA_IMAGE}."

      # `wrangler versions upload` refuses outright on a Worker that does not
      # exist: "You cannot upload a new version of a Worker that does not yet
      # exist. Please run the `deploy` command first." On a fresh account that
      # is unavoidable and says nothing about the change under review —
      # production has never deployed, so there is no Worker to add a version
      # to. It happened on the pull request that turned this on, and a red
      # check meaning "this account is new" is the kind of red that teaches
      # people to stop reading red.
      #
      # Deliberately a skip rather than a `continue-on-error`: this must stay
      # able to fail for every *other* reason. docs/deployment.md §5 has the
      # bootstrap order, of which this is the half nothing had written down.
      - name: Does the preview Worker exist yet?
        id: worker
        if: steps.guard.outputs.configured == 'true' && steps.guard.outputs.mode == 'preview'
        working-directory: web
        run: |
          if npx wrangler versions list -c wrangler.preview.jsonc >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::concestor-preview does not exist on this account yet — a version cannot be uploaded to a Worker that has never been deployed. Run 'npx wrangler deploy -c wrangler.preview.jsonc' once from a checkout, then re-run. Skipping the preview, not failing the run."
          fi

      # A version upload, not a deploy: it publishes a preview URL and moves no
      # traffic anywhere. `--preview-alias` gives the branch a stable hostname
      # instead of a new hash on every push.
      #
      # Against `wrangler.preview.jsonc` — the Worker with no container. The
      # production config cannot carry a preview at all, which is the header
      # comment's subject. `API_ORIGIN` comes from that file and points at
      # production, so `/v1` is answered by the real dataset through the real
      # edge cache; the `--var` here overrides it only where somebody has set
      # the repository variable, which is the same escape hatch production has.
      - name: Upload preview version
        id: preview
        if: steps.guard.outputs.configured == 'true' && steps.guard.outputs.mode == 'preview' && steps.worker.outputs.exists == 'true'
        working-directory: web
        env:
          ALIAS: ${{ steps.guard.outputs.alias }}
        run: |
          set -o pipefail
          args=""
          if [ -n "$API_ORIGIN" ]; then args="--var API_ORIGIN:${API_ORIGIN}"; fi
          # shellcheck disable=SC2086
          npx wrangler versions upload -c wrangler.preview.jsonc $args \
            --preview-alias "$ALIAS" \
            --message "$ALIAS — ${{ github.sha }}" | tee "$RUNNER_TEMP/upload.log"

          # Read back rather than composed. The hostname contains the account's
          # workers.dev subdomain, which is not in this repository and would
          # otherwise have to be pasted into it — and a URL this workflow
          # *asserts* is one that goes on being printed after the day it stops
          # being true. That is the failure this whole change exists to fix.
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/upload.log" | grep -- "//${ALIAS}-" | head -1)
          if [ -z "$url" ]; then
            echo "::warning::wrangler printed no aliased preview URL. Preview URLs may be disabled on the Worker — check 'preview_urls' in web/wrangler.preview.jsonc and the Worker's Settings → Domains & Routes."
            exit 0
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview"
            echo
            echo "$url"
            echo
            echo "The branch's frontend, against production's dataset and production's server binary."
          } >> "$GITHUB_STEP_SUMMARY"

      # On the pull request, because that is where somebody is standing when
      # they want it. Edited rather than appended: the alias is stable across
      # every push to the branch, so a second comment would say the same thing
      # again.
      - name: Comment the preview URL
        if: steps.preview.outputs.url != '' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          # A file rather than an inline --body, because the text carries
          # backticks and apostrophes and quoting it through two shells is how
          # a comment ends up containing half a command substitution.
          cat > "$RUNNER_TEMP/comment.md" <<EOF
          **Preview:** $URL

          The branch built and uploaded as a version of \`concestor-preview\`, with \`/v1\` proxied to production — so this is your frontend against the real dataset. It is not a deploy and moves no traffic.

          Changes under \`server/\` or \`pipeline/\` are **not** in here: the API is production's, pinned by the container image tag in \`web/wrangler.jsonc\`.
          EOF
          gh pr comment "${{ github.event.number }}" --edit-last --create-if-none --body-file "$RUNNER_TEMP/comment.md"

      - name: Deploy
        if: steps.guard.outputs.configured == 'true' && steps.guard.outputs.mode == 'production'
        working-directory: web
        # --var overrides wrangler.jsonc's empty API_ORIGIN. Empty is the
        # normal case and means "use the Container"; a value routes /v1 to an
        # external origin instead. It is a plaintext variable and must stay
        # one: it is a public origin the browser already sends every request
        # to, not a secret.
        run: |
          npx wrangler deploy \
            --var "API_ORIGIN:${API_ORIGIN}" \
            --message "${{ inputs.release_tag || github.sha }}"

      # **A deploy is two things and they are not atomic**, and nothing here
      # closes that. `deploy` returns when the Worker version is live; the
      # Container pulls a 2.2 GB image behind it, ~3 minutes measured. Workers
      # Cache is keyed by Worker version, so the new version starts empty and
      # requests arriving in the gap are answered by the *old* container and
      # cached under the *new* version's key for a year — the deploy creating
      # the entries that outlive it. docs/deployment.md §5 has the measurement
      # and the manual remedy, which is to wait for /v1/about to report the
      # pinned commit and then re-run this workflow.
      #
      # **This was automated here and the automation is deliberately gone.**
      # The step polled `/v1/about` from the runner; every request came back
      # unreachable — a curl from these IPs does not get through, where the
      # same one from a laptop is a 200 — so it treated "cannot see the site"
      # as "still rolling" and spent its whole ten-minute window on it, on
      # every deploy, warning at the end. A guard that cannot reach the thing
      # it guards is worse than a documented step: it stalls the pipeline and
      # it looks like protection. Do not re-add it without first establishing
      # that CI can read concestor.com at all.
